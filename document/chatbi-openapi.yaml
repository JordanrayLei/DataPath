openapi: 3.1.0
info:
  title: ChatBI Backend API
  version: 1.0.0
  description: |
    Backend contract consumed by the Dify ChatBI workflow.

    The API is fail-closed. LLM-generated SQL, physical table names, credentials,
    and permission expressions are never accepted as trusted execution input.
    The current Dify workflow sends `compiled_query` to the execute endpoint for
    compatibility; that field is deprecated and must be ignored as an authority.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Context
  - name: Metrics
  - name: DSL
  - name: Query
  - name: Result
  - name: Interpretation
  - name: Reflection
security:
  - bearerAuth: []
paths:
  /api/chatbi/context/load:
    post:
      tags: [Context]
      operationId: loadChatContext
      summary: Load trusted identity, workspace policy, and prior query context
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextLoadRequest'
            examples:
              demo:
                value:
                  workspace_id: demo
                  conversation_id: conv_001
                  identity_token: demo-server-issued-token
      responses:
        '200':
          description: Context loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextLoadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/chatbi/metrics/retrieve:
    post:
      tags: [Metrics]
      operationId: retrieveMetrics
      summary: Retrieve authorized metric candidates and return a discrete gate status
      description: |
        Candidate filtering by workspace, published state, business domain, and
        permissions happens before any candidate is returned to Dify or an LLM.
        `probability` is a calibrated confidence value; rank-fusion scores must not
        be exposed as probabilities.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricRetrieveRequest'
            examples:
              grossMargin:
                value:
                  query: 查询 2026 年线下各区域每月毛利率
                  normalized_query: 查询 2026 年线下渠道各区域每月毛利率
                  workspace_id: demo
                  biz_domain: sales
                  operator_id: public_demo_user
                  context: {}
                  preprocess:
                    normalized_query: 查询 2026 年线下渠道各区域每月毛利率
                    metric_mentions: [毛利率]
                    dimension_mentions: [区域, 月份]
                    filter_mentions:
                      - field: 渠道
                        value: 线下
                    time_text: 2026 年
                    time_start: '2026-01-01'
                    time_end: '2026-12-31'
                    comparison: ''
                    inherit_context: false
      responses:
        '200':
          description: Retrieval decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricRetrieveResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/chatbi/dsl/validate:
    post:
      tags: [DSL]
      operationId: validateQueryDsl
      summary: Validate and normalize Query DSL 1.0
      description: |
        Validates protocol version, metric version and state, dimensions, filters,
        model compatibility, time range, query limits, workspace, and policy context.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DslValidateRequest'
      responses:
        '200':
          description: Validation decision; business invalidity is represented in the body status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DslValidateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/chatbi/query/compile:
    post:
      tags: [Query]
      operationId: compileQuery
      summary: Compile validated semantic DSL and apply SQL safety controls
      description: |
        Generates SQL deterministically from published metric definitions and model
        relationships. SQL text is stored server-side and is not returned by default.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompileRequest'
      responses:
        '200':
          description: Compile and execution-gate decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/chatbi/query/execute:
    post:
      tags: [Query]
      operationId: executeQuery
      summary: Execute a server-side compiled and authorized query
      description: |
        The server revalidates workspace, operator, metric versions, policy version,
        SQL fingerprint, expiration, and approval proof. It must never execute SQL
        supplied in the request body.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
      responses:
        '200':
          description: Query result or terminal query status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key conflicts with different query content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          description: Warehouse execution timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/chatbi/result/profile:
    post:
      tags: [Result]
      operationId: profileResult
      summary: Build deterministic statistics, chart specification, and evidence
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Result profile and evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/chatbi/interpretation/generate:
    post:
      tags: [Interpretation]
      operationId: generateInterpretation
      summary: Generate deterministic evidence-bound interpretation fallback
      description: |
        Builds a conservative Interpretation from server-generated Evidence. This
        endpoint is intended as a stable fallback when external LLM providers are
        unavailable or streaming responses fail.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterpretationGenerateRequest'
      responses:
        '200':
          description: Deterministic interpretation candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterpretationGenerateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Query, DSL, or profile does not match stored evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/chatbi/reflection/validate:
    post:
      tags: [Reflection]
      operationId: validateInterpretation
      summary: Validate interpretation against deterministic evidence
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionRequest'
      responses:
        '200':
          description: Reflection decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token

  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Client-generated request identifier. The server generates one when absent.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    XTraceId:
      name: X-Trace-ID
      in: header
      required: false
      description: Distributed trace identifier propagated through Dify and backend services.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Must equal the query_id for the current Dify workflow.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    Unauthorized:
      description: Missing or invalid service token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The caller cannot access the requested workspace or resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request envelope or field validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal service failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    TraceContext:
      type: object
      properties:
        request_id:
          type: string
        trace_id:
          type: string

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/TraceContext'
        - type: object
          additionalProperties: false
          required: [status, code, message, retryable]
          properties:
            status:
              type: string
              const: ERROR
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]{2,100}$'
            message:
              type: string
              maxLength: 1000
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true

    ContextLoadRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, conversation_id, identity_token]
      properties:
        workspace_id:
          type: string
          minLength: 1
          maxLength: 128
        conversation_id:
          type: string
          minLength: 1
          maxLength: 128
        identity_token:
          type: string
          minLength: 1
          maxLength: 4096

    LastQueryContext:
      type: object
      additionalProperties: false
      required: [metrics, dimensions, filters, time_range]
      properties:
        metrics:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [metric_id, metric_version]
            properties:
              metric_id:
                type: string
              metric_version:
                type: integer
                minimum: 1
        dimensions:
          type: array
          maxItems: 5
          items:
            type: string
        filters:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: true
        time_range:
          oneOf:
            - $ref: '#/components/schemas/TimeRange'
            - type: 'null'

    ContextLoadResponse:
      allOf:
        - $ref: '#/components/schemas/TraceContext'
        - type: object
          additionalProperties: false
          required:
            - operator_id
            - allowed_domains
            - role_ids
            - row_policy_token
            - last_query_context
          properties:
            operator_id:
              type: string
            allowed_domains:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [sales, advertising]
            role_ids:
              type: array
              uniqueItems: true
              items:
                type: string
            row_policy_token:
              type: string
              description: Opaque short-lived policy reference; no policy expression is exposed.
            last_query_context:
              $ref: '#/components/schemas/LastQueryContext'

    FilterMention:
      type: object
      additionalProperties: false
      required: [field, value]
      properties:
        field:
          type: string
          maxLength: 200
        value:
          type: string
          maxLength: 500

    PreprocessData:
      type: object
      additionalProperties: false
      required:
        - normalized_query
        - metric_mentions
        - dimension_mentions
        - filter_mentions
        - time_text
        - time_start
        - time_end
        - comparison
        - inherit_context
      properties:
        normalized_query:
          type: string
          maxLength: 4000
        metric_mentions:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 200
        dimension_mentions:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 200
        filter_mentions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/FilterMention'
        time_text:
          type: string
          maxLength: 500
        time_start:
          type: string
          maxLength: 50
        time_end:
          type: string
          maxLength: 50
        comparison:
          type: string
          maxLength: 200
        inherit_context:
          type: boolean

    MetricRetrieveRequest:
      type: object
      additionalProperties: false
      required:
        - query
        - normalized_query
        - workspace_id
        - biz_domain
        - operator_id
        - context
        - preprocess
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
        normalized_query:
          type: string
          minLength: 1
          maxLength: 4000
        workspace_id:
          type: string
        biz_domain:
          type: string
          enum: [sales, advertising]
        operator_id:
          type: string
        context:
          type: object
          additionalProperties: true
        preprocess:
          $ref: '#/components/schemas/PreprocessData'

    MetricCandidate:
      type: object
      additionalProperties: false
      required:
        - metric_id
        - metric_version
        - display_name
        - metric_type
        - unit
        - business_definition
        - probability
        - retrieval_sources
        - authorized
      properties:
        metric_id:
          type: string
          pattern: '^M_[A-Z0-9_]{2,100}$'
        metric_version:
          type: integer
          minimum: 1
        display_name:
          type: string
        metric_type:
          type: string
          enum: [amount, count, ratio, average]
        unit:
          type: string
        business_definition:
          type: string
        probability:
          type: number
          minimum: 0
          maximum: 1
        retrieval_sources:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [exact_name, alias, bm25, dense, context]
        authorized:
          type: boolean
          const: true

    MetricMentionDecision:
      type: object
      additionalProperties: false
      required: [text, selected_metric_id, probability, candidates]
      properties:
        text:
          type: string
        selected_metric_id:
          type: string
          description: Empty when no metric is safely selected.
        selected_metric_version:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        probability:
          type: number
          minimum: 0
          maximum: 1
        candidates:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/MetricCandidate'

    MetricRetrieveResponse:
      allOf:
        - $ref: '#/components/schemas/TraceContext'
        - type: object
          additionalProperties: false
          required: [gate_status, mentions, reason_codes, clarification_message]
          properties:
            gate_status:
              type: string
              enum: [PASS, LLM_DISAMBIGUATE, CLARIFY, REJECT]
            mentions:
              type: array
              maxItems: 10
              items:
                $ref: '#/components/schemas/MetricMentionDecision'
            reason_codes:
              type: array
              uniqueItems: true
              items:
                type: string
                pattern: '^[A-Z][A-Z0-9_]{2,100}$'
            clarification_message:
              type: string
              maxLength: 1000
            time_resolution:
              type: object
              additionalProperties: true
              description: Authoritative semantic-layer hints for relative time resolution.
            dsl_generation_constraints:
              type: array
              items:
                type: string
              description: Natural-language constraints that downstream DSL generation must follow.

    QueryDsl:
      $ref: './query-dsl-v1.schema.json'

    DslValidateRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, operator_id, row_policy_context, dsl]
      properties:
        workspace_id:
          type: string
        operator_id:
          type: string
        row_policy_context:
          type: object
          additionalProperties: true
        dsl:
          $ref: '#/components/schemas/QueryDsl'

    ValidationIssue:
      type: object
      additionalProperties: false
      required: [code, message, field_path]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,100}$'
        message:
          type: string
        field_path:
          type: string
        safe_to_show:
          type: boolean
          default: true

    DslValidateResponse:
      allOf:
        - $ref: '#/components/schemas/TraceContext'
        - type: object
          additionalProperties: false
          required: [status, normalized_dsl, issues, message]
          properties:
            status:
              type: string
              enum: [VALID, CLARIFY, DENY, INVALID]
            normalized_dsl:
              oneOf:
                - $ref: '#/components/schemas/QueryDsl'
                - type: 'null'
            issues:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
            message:
              type: string
              maxLength: 1000

    CompileRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, operator_id, dsl, permission_context]
      properties:
        workspace_id:
          type: string
        operator_id:
          type: string
        dsl:
          $ref: '#/components/schemas/QueryDsl'
        permission_context:
          type: object
          additionalProperties: true

    MetricVersionMap:
      type: object
      additionalProperties:
        type: integer
        minimum: 1

    Lineage:
      type: object
      additionalProperties: false
      required: [models, tables, fields]
      properties:
        models:
          type: array
          uniqueItems: true
          items:
            type: string
        tables:
          type: array
          uniqueItems: true
          items:
            type: string
        fields:
          type: array
          uniqueItems: true
          items:
            type: string

    EstimatedCost:
      type: object
      additionalProperties: false
      required: [risk_level, estimated_rows, estimated_bytes]
      properties:
        risk_level:
          type: string
          enum: [low, medium, high, blocked]
        estimated_rows:
          type: integer
          minimum: 0
        estimated_bytes:
          type: integer
          minimum: 0

    CompileResponse:
      allOf:
        - $ref: '#/components/schemas/TraceContext'
        - type: object
          additionalProperties: false
          required:
            - status
            - query_id
            - sql_fingerprint
            - dsl_hash
            - metric_versions
            - lineage
            - estimated_cost
            - expires_at
            - message
          properties:
            status:
              type: string
              enum: [READY, NEED_APPROVAL, BLOCKED]
            query_id:
              type: string
            sql_fingerprint:
              type: string
              pattern: '^sha256:[a-fA-F0-9]{64}$'
            dsl_hash:
              type: string
              pattern: '^sha256:[a-fA-F0-9]{64}$'
            metric_versions:
              $ref: '#/components/schemas/MetricVersionMap'
            lineage:
              $ref: '#/components/schemas/Lineage'
            estimated_cost:
              $ref: '#/components/schemas/EstimatedCost'
            execution_token:
              type: string
              description: Short-lived signed token for READY queries. It contains no SQL text.
            expires_at:
              type: string
              format: date-time
            message:
              type: string

    ExecuteRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, operator_id, query_id]
      properties:
        workspace_id:
          type: string
        operator_id:
          type: string
        query_id:
          type: string
        execution_token:
          type: string
          description: Preferred signed execution proof returned by the compiler.
        approval_token:
          type: string
          description: Required only for NEED_APPROVAL queries after approval.
        compiled_query:
          type: object
          additionalProperties: true
          deprecated: true
          description: |
            Compatibility field sent by the current Dify DSL. The server must ignore
            it as executable content and load the compiled query by query_id.

    ResultColumn:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [string, integer, decimal, boolean, date, datetime]
        unit:
          type: string
        metric_id:
          type: string
        dimension_id:
          type: string

    DataQualitySummary:
      type: object
      additionalProperties: false
      required: [freshness, completeness]
      properties:
        freshness:
          type: string
          enum: [normal, delayed, unknown]
        data_updated_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        completeness:
          type: number
          minimum: 0
          maximum: 1
        warnings:
          type: array
          items:
            type: string

    ExecuteResponse:
      allOf:
        - $ref: '#/components/schemas/TraceContext'
        - type: object
          additionalProperties: false
          required:
            - query_id
            - status
            - columns
            - rows
            - row_count
            - execution_ms
            - cached
            - truncated
            - result_ref
            - data_quality
          properties:
            query_id:
              type: string
            status:
              type: string
              enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]
            columns:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ResultColumn'
            rows:
              type: array
              maxItems: 5000
              items:
                type: object
                additionalProperties: true
            row_count:
              type: integer
              minimum: 0
            execution_ms:
              type: integer
              minimum: 0
            cached:
              type: boolean
            truncated:
              type: boolean
            result_ref:
              oneOf:
                - type: string
                - type: 'null'
            data_quality:
              $ref: '#/components/schemas/DataQualitySummary'
            error:
              oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - type: 'null'

    ProfileRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, query_id, execution_result, dsl]
      properties:
        workspace_id:
          type: string
        query_id:
          type: string
        execution_result:
          $ref: '#/components/schemas/ExecuteResponse'
        dsl:
          $ref: '#/components/schemas/QueryDsl'

    TimeRange:
      type: object
      additionalProperties: false
      required: [start, end, timezone]
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        timezone:
          type: string
          default: Asia/Shanghai

    EvidenceComparison:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          type: string
        baseline_value:
          oneOf:
            - type: number
            - type: string
            - type: 'null'
        absolute_change:
          oneOf:
            - type: number
            - type: 'null'
        change_rate:
          oneOf:
            - type: number
            - type: 'null'
        z_score:
          oneOf:
            - type: number
            - type: 'null'
        share:
          oneOf:
            - type: number
            - type: 'null'

    Evidence:
      type: object
      additionalProperties: false
      required:
        - evidence_id
        - evidence_type
        - statement
        - metric_id
        - metric_version
        - value
        - unit
        - time_range
        - dimensions
        - query_id
        - calculation
        - row_refs
      properties:
        evidence_id:
          type: string
        evidence_type:
          type: string
          enum: [headline, trend, anomaly, contribution]
        statement:
          type: string
        metric_id:
          type: string
        metric_version:
          type: integer
          minimum: 1
        value:
          oneOf:
            - type: number
            - type: string
            - type: 'null'
        unit:
          type: string
        time_range:
          $ref: '#/components/schemas/TimeRange'
        dimensions:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        comparison:
          oneOf:
            - $ref: '#/components/schemas/EvidenceComparison'
            - type: 'null'
        query_id:
          type: string
        calculation:
          type: string
        row_refs:
          type: array
          items:
            type: integer
            minimum: 0

    HeadlineMetric:
      type: object
      additionalProperties: false
      required: [metric_id, metric_version, display_name, value, unit, scope, dimensions, evidence_id]
      properties:
        metric_id: {type: string}
        metric_version: {type: integer, minimum: 1}
        display_name: {type: string}
        value:
          oneOf:
            - type: number
            - type: string
            - type: 'null'
        unit: {type: string}
        scope:
          type: string
          enum: [latest_period, full_range, single_result]
        dimensions:
          type: object
          additionalProperties: true
        evidence_id: {type: string}

    TrendSummary:
      type: object
      additionalProperties: false
      required: [metric_id, metric_version, start_value, end_value, absolute_change, change_rate, direction, point_count, evidence_id]
      properties:
        metric_id: {type: string}
        metric_version: {type: integer, minimum: 1}
        start_value: {type: number}
        end_value: {type: number}
        absolute_change: {type: number}
        change_rate:
          oneOf:
            - type: number
            - type: 'null'
        direction:
          type: string
          enum: [up, down, flat]
        point_count: {type: integer, minimum: 2}
        evidence_id: {type: string}

    AnomalyPoint:
      type: object
      additionalProperties: false
      required: [metric_id, metric_version, time_value, value, z_score, direction, dimensions, evidence_id]
      properties:
        metric_id: {type: string}
        metric_version: {type: integer, minimum: 1}
        time_value: {type: string}
        value: {type: number}
        z_score: {type: number}
        direction:
          type: string
          enum: [high, low]
        dimensions:
          type: object
          additionalProperties: true
        evidence_id: {type: string}

    DimensionContribution:
      type: object
      additionalProperties: false
      required: [metric_id, metric_version, dimension_id, dimension_value, value, share, rank, evidence_id]
      properties:
        metric_id: {type: string}
        metric_version: {type: integer, minimum: 1}
        dimension_id: {type: string}
        dimension_value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
        value: {type: number}
        share: {type: number, minimum: 0, maximum: 1}
        rank: {type: integer, minimum: 1}
        evidence_id: {type: string}

    ChartSpec:
      type: object
      additionalProperties: false
      required: [type, x, y, title]
      properties:
        type:
          type: string
          enum: [line, bar, grouped_bar, stacked_bar, area, table, metric]
        x:
          type: string
        y:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        series:
          oneOf:
            - type: string
            - type: 'null'
        title:
          type: string

    ProfileResponse:
      allOf:
        - $ref: '#/components/schemas/TraceContext'
        - type: object
          additionalProperties: false
          required:
            - profile_id
            - profile_version
            - query_id
            - headline_metrics
            - trend_summary
            - anomalies
            - dimension_contributions
            - chart_spec
            - evidence
            - caveats
          properties:
            profile_id:
              type: string
            profile_version:
              type: string
              const: '1.0'
            query_id:
              type: string
            headline_metrics:
              type: array
              items:
                $ref: '#/components/schemas/HeadlineMetric'
            trend_summary:
              type: array
              items:
                $ref: '#/components/schemas/TrendSummary'
            anomalies:
              type: array
              items:
                $ref: '#/components/schemas/AnomalyPoint'
            dimension_contributions:
              type: array
              items:
                $ref: '#/components/schemas/DimensionContribution'
            chart_spec:
              $ref: '#/components/schemas/ChartSpec'
            evidence:
              type: array
              items:
                $ref: '#/components/schemas/Evidence'
            caveats:
              type: array
              items:
                type: string

    Finding:
      type: object
      additionalProperties: false
      required: [text, evidence_ids]
      properties:
        text:
          type: string
          maxLength: 2000
        evidence_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string

    Interpretation:
      type: object
      additionalProperties: false
      required: [title, findings, caveats, next_actions]
      properties:
        title:
          type: string
          maxLength: 500
        findings:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Finding'
        caveats:
          type: array
          maxItems: 10
          items:
            type: string
        next_actions:
          type: array
          maxItems: 10
          items:
            type: string

    InterpretationGenerateRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, query_id, dsl, profile]
      properties:
        workspace_id:
          type: string
        query_id:
          type: string
        dsl:
          $ref: '#/components/schemas/QueryDsl'
        profile:
          $ref: '#/components/schemas/ProfileResponse'

    InterpretationGenerateResponse:
      allOf:
        - $ref: '#/components/schemas/TraceContext'
        - type: object
          additionalProperties: false
          required: [interpretation]
          properties:
            interpretation:
              $ref: '#/components/schemas/Interpretation'

    ReflectionRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, query_id, dsl, profile, interpretation]
      properties:
        workspace_id:
          type: string
        query_id:
          type: string
        dsl:
          $ref: '#/components/schemas/QueryDsl'
        profile:
          $ref: '#/components/schemas/ProfileResponse'
        interpretation:
          $ref: '#/components/schemas/Interpretation'

    ReflectionIssue:
      type: object
      additionalProperties: false
      required: [code, message, finding_index]
      properties:
        code:
          type: string
          enum:
            - UNKNOWN_EVIDENCE_ID
            - NUMERIC_MISMATCH
            - UNIT_MISMATCH
            - TIME_RANGE_MISMATCH
            - METRIC_VERSION_MISMATCH
            - MISSING_DATA_QUALITY_CAVEAT
            - UNSUPPORTED_CAUSAL_CLAIM
            - SENSITIVE_DATA_EXPOSURE
            - UNSUPPORTED_CLAIM
        message:
          type: string
        finding_index:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'

    ReflectionResponse:
      allOf:
        - $ref: '#/components/schemas/TraceContext'
        - type: object
          additionalProperties: false
          required: [status, issues, revision_instruction]
          properties:
            status:
              type: string
              enum: [PASS, REVISE, BLOCK]
            issues:
              type: array
              items:
                $ref: '#/components/schemas/ReflectionIssue'
            revision_instruction:
              type: string
              maxLength: 4000
