      - data:
          code: |
            import json

            ALLOWED = {"PASS", "LLM_DISAMBIGUATE", "CLARIFY", "REJECT"}

            def main(body: str, status_code: int) -> dict:
                try:
                    data = json.loads(body) if body else {}
                except Exception:
                    data = {}
                gate = str(data.get("gate_status", "REJECT"))
                if not (200 <= int(status_code or 0) < 300) or gate not in ALLOWED:
                    gate = "REJECT"
                mentions = data.get("mentions", [])
                candidates = []
                for mention in mentions:
                    for candidate in mention.get("candidates", []) or []:
                        candidates.append(candidate)
                lines = []
                for index, candidate in enumerate(candidates[:5], start=1):
                    lines.append(f"{index}. {candidate.get('display_name', candidate.get('metric_id', 'unknown'))} [{candidate.get('metric_id', '')}] type={candidate.get('metric_type', '')}")
                return {
                    "gate_status": gate,
                    "retrieval_json": json.dumps(data, ensure_ascii=False),
                    "candidates_text": "\n".join(lines),
                    "clarification_message": str(data.get("clarification", "请选择正确的指标口径。")),
                }
          code_language: python3
          desc: 将检索结果转换为离散分流决策。
