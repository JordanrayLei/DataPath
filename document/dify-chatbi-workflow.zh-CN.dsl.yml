app:
  description: DataPath AI 编排工作流。LLM 负责意图理解和 DSL 解析；外部服务负责指标检索、规则校验、SQL 编译、数仓执行、结果画像和 Reflection。
  icon: 📊
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: workflow
  name: DataPath AI 编排器
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
    - description: 确定性 ChatBI 后端服务的基础地址，导入后必须替换。
      id: env-chatbi-api-base-url
      name: CHATBI_API_BASE_URL
      value: http://host.docker.internal:8000/api/chatbi
      value_type: string
    - description: Dify 调用 ChatBI 后端使用的服务令牌，导入后必须替换。
      id: env-chatbi-api-token
      name: CHATBI_API_TOKEN
      value: replace-me
      value_type: secret
  features:
    file_upload:
      allowed_file_extensions:
        - .JPG
        - .JPEG
        - .PNG
        - .GIF
        - .WEBP
        - .SVG
      allowed_file_types:
        - image
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data: {isInIteration: false, isInLoop: false, sourceType: start, targetType: http-request}
        id: start-source-context-http-target
        source: start
        sourceHandle: source
        target: context_http
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: code}
        id: context-http-source-context-parse-target
        source: context_http
        sourceHandle: source
        target: context_parse
        targetHandle: target
