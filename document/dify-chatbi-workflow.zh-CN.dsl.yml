    nodes:
      - data:
          desc: ChatBI 请求入口。用户身份与权限必须由后端重新加载和校验。
          selected: false
          title: 用户输入
          type: start
          variables:
            - label: 用户问题
              max_length: 4000
              options: []
              required: true
              type: paragraph
              variable: query
            - label: 工作空间 ID
              max_length: 128
              options: []
              required: true
              type: text-input
              variable: workspace_id
            - label: 业务域
              max_length: 128
              options: []
              required: true
              type: text-input
              variable: biz_domain
            - label: 会话 ID
              max_length: 128
              options: []
              required: true
              type: text-input
              variable: conversation_id
            - label: 时区
              max_length: 64
              options: []
              required: true
              type: text-input
              variable: timezone
            - label: 身份令牌
              max_length: 2048
              options: []
              required: true
              type: text-input
              variable: identity_token
        height: 220
        id: start
        position: {x: 40, y: 420}
        positionAbsolute: {x: 40, y: 420}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization: {type: no-auth}
          body:
            type: json
            data: |
              {"workspace_id":"{{#start.workspace_id#}}","conversation_id":"{{#start.conversation_id#}}","identity_token":"{{#start.identity_token#}}"}
          desc: 加载权威用户身份、权限引用和上一轮查询上下文。
          headers: |-
            Authorization: Bearer {{#env.CHATBI_API_TOKEN#}}
            Content-Type: application/json
            X-Request-ID: {{#sys.workflow_run_id#}}
            X-Trace-ID: {{#sys.workflow_run_id#}}
          method: post
          params: ''
          retry_config:
            enabled: true
            max_retries: 1
            retry_interval: 1000
            exponential_backoff: {enabled: false, multiplier: 2, max_interval: 10000}
          timeout: {connect: 10, read: 30, write: 30}
          title: 上下文加载
          type: http-request
          url: '{{#env.CHATBI_API_BASE_URL#}}/context/load'
        height: 130
        id: context_http
        position: {x: 350, y: 420}
        positionAbsolute: {x: 350, y: 420}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            import json

            def main(body: str, status_code: int) -> dict:
                try:
                    data = json.loads(body) if body else {}
                except Exception:
                    data = {}
                return {
                    "context_ok": bool(200 <= int(status_code or 0) < 300 and data),
                    "context_json": json.dumps(data, ensure_ascii=False),
                    "operator_id": str(data.get("operator_id", "")),
                    "last_query_context": json.dumps(data.get("last_query_context", {}), ensure_ascii=False),
                }
          code_language: python3
          desc: 将上下文服务响应转换为稳定的工作流变量。
          outputs:
            context_ok: {children: null, type: boolean}
            context_json: {children: null, type: string}
            operator_id: {children: null, type: string}
            last_query_context: {children: null, type: string}
          selected: false
          title: 解析上下文
          type: code
          variables:
            - variable: body
              value_selector: [context_http, body]
            - variable: status_code
              value_selector: [context_http, status_code]
        height: 90
        id: context_parse
        position: {x: 650, y: 420}
        positionAbsolute: {x: 650, y: 420}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: case_ok
              conditions:
                - comparison_operator: is
                  id: context-ok-condition
                  value: true
                  varType: boolean
                  variable_selector: [context_parse, context_ok]
              id: case_ok
              logical_operator: and
          desc: 上下文加载失败、身份无效或响应不可解析时必须立即终止。
          selected: false
          title: 上下文安全门控
          type: if-else
        height: 120
        id: context_gate
        position: {x: 650, y: 160}
        positionAbsolute: {x: 650, y: 160}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 身份或上下文加载失败时的 fail-closed 终态。
          outputs:
            - value_selector: [context_parse, context_ok]
              value_type: boolean
              variable: context_ok
            - value_selector: [context_parse, context_json]
              value_type: string
              variable: context_error
          selected: false
          title: 上下文加载失败
          type: end
        height: 100
        id: context_error_end
        position: {x: 950, y: 160}
        positionAbsolute: {x: 950, y: 160}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context: {enabled: false, variable_selector: []}
          desc: 标准化用户问题并抽取实体，不得编造指标 ID 或 SQL。
