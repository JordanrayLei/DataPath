[project]
name = "data-agent"
version = "0.1.0"
description = "Metadata-driven AI data operations and trusted ChatBI platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pgvector>=0.3,<1",
  "rank-bm25>=0.2.2,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "openapi-spec-validator>=0.9,<1",
  "pytest>=8.3,<10",
  "pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
